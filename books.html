<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books JSON Fetch</title>
</head>
<body>
    <div id="display-area"></div>

    <script>
        async function fetchBooks() {
            try {
                const response = await fetch('books.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                const books = data.books;
                const displayArea = document.getElementById('display-area');

            
                const p1 = document.createElement('p');
                p1.textContent = `First book title: ${books[0].title}`;
                displayArea.appendChild(p1);

             
                const p2 = document.createElement('p');
                p2.textContent = `Second book author: ${books[1].author}`;
                displayArea.appendChild(p2);

                const p3 = document.createElement('p');
                p3.textContent = `${books[0].title} genres: ${books[0].genres.join(', ')}`;
                displayArea.appendChild(p3);

                const p4 = document.createElement('p');
                p4.textContent = `${books[1].title} genres: ${books[1].genres.join(', ')}`;
                displayArea.appendChild(p4);

            } catch (error) {
           
                document.getElementById('display-area').textContent = "Sorry, we couldn't load the book data at this time. Please check your connection or local server.";
                console.error("Error fetching JSON:", error);
            }
        }

        fetchBooks();
    </script>
</body>
</html>
